services:
  - type: web
    name: newtonite-ops-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/newtonite.db
      - key: CORS_ORIGIN
        value: "*"
